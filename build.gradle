plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT' apply false
    id 'maven-publish'
}

// 26.2 运行时使用 official 命名，用 no-remap 插件；
// 1.21.11 仍是 intermediary，用带重映射的旧插件。
def minecraftVersion = project.findProperty("minecraft_version").toString()
apply plugin: (minecraftVersion == "26.2" ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap')

version = "${project.mod_version}-fabric-${project.minecraft_version}"
group = project.maven_group

// 目标 Java 版本随 Minecraft 版本变化（26.2 -> 25，1.21.11 -> 21）。
def targetJavaVersion = (project.findProperty("java_version") ?: "25").toString().toInteger()

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "autofishing" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// 单元测试覆盖纯逻辑类（检测/预测/状态机/配置），不加载 Minecraft。
sourceSets {
    // 版本相关胶水代码；共享代码仍在 src/client/java。
    client {
        java.srcDir "src/versions/${project.minecraft_version}/java"
    }
    test {
        compileClasspath += sourceSets.client.output
        runtimeClasspath += sourceSets.client.output
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // 单元测试依赖（JUnit）以及通用库
    mavenCentral()

    // Modrinth Maven
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    if (minecraftVersion == "26.2") {
        // 26.2 的 mod jar 已是 official 命名，直接当普通依赖即可。
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
        implementation "maven.modrinth:cloth-config:${project.cloth_config_version}"
        implementation "maven.modrinth:modmenu:${project.modmenu_version}"
    } else {
        // 1.21.11 走经典重映射路径，显式使用 Mojang 官方命名。
        mappings loom.officialMojangMappings()
        // modImplementation 让 Loom 把 intermediary 的 mod jar 重映射到当前命名空间。
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
        modImplementation "maven.modrinth:cloth-config:${project.cloth_config_version}"
        modImplementation "maven.modrinth:modmenu:${project.modmenu_version}"
    }

    // 单元测试
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // 生产环境由 Minecraft 提供 Gson；测试需要显式依赖
    testImplementation "com.google.code.gson:gson:2.11.0"
    testImplementation "org.slf4j:slf4j-api:2.0.16"
}

tasks.named("test") {
    useJUnitPlatform()
}


processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "java_version", targetJavaVersion
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "java_version": targetJavaVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
