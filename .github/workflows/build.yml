# Build the mod for every supported Minecraft version.
# Each matrix entry overrides the Gradle properties from gradle.properties;
# the version-specific glue code lives in src/versions/<minecraft_version>/.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "26.2"
            loader: "0.19.3"
            fabric_api: "0.157.0+26.2"
            cloth: "26.2.155+fabric"
            modmenu: "20.0.1"
            java: "25"
          - mc: "1.21.11"
            loader: "0.20.1"
            fabric_api: "0.141.6+1.21.11"
            cloth: "21.11.153+fabric"
            modmenu: "17.0.1"
            java: "21"
    name: build (${{ matrix.mc }})
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: >-
          ./gradlew build
          -Pminecraft_version=${{ matrix.mc }}
          -Ploader_version=${{ matrix.loader }}
          -Pfabric_version=${{ matrix.fabric_api }}
          -Pcloth_config_version=${{ matrix.cloth }}
          -Pmodmenu_version=${{ matrix.modmenu }}
          -Pjava_version=${{ matrix.java }}
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts-${{ matrix.mc }}
          path: build/libs/